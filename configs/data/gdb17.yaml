_target_: src.data.data_lightning.DataModule

dataset:
  _target_: src.data.components.lmdb_datasets.GDB17LoopV2
  root: ${paths.data_dir}/gdb-17v2
  data_type: ${data_type}
  version: ood
  get_ovlp: true
  processed_link: null  # optional, e.g. ${paths.data_dir}/gdb-17-simple/processed

train_cfg:
  batch_size: 6
  num_workers: 12
  pin_memory: true
  persistent_workers: false
  shuffle: true # matually exclusive with sampler
  mode: ${model.lit_cfg.train_mode}

train_sampler: null

val_cfg:
  batch_size: 10
  num_workers: 2
  pin_memory: true
  shuffle: false
  mode: ${model.lit_cfg.val_mode}

test_cfg:
  batch_size: 1
  num_workers: 0
  pin_memory: true
  shuffle: false
  more_info: true
  mode: ${model.lit_cfg.test_mode}
