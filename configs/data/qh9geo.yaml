_target_: src.data.data_lightning.DataModule

dataset:
  _target_: src.data.components.lmdb_datasets.QH9Dynamic
  root: ${paths.data_dir}
  data_type: ${data_type}
  split: mol
  version: 100k

train_cfg:
  batch_size: 1
  num_workers: 6
  pin_memory: true
  persistent_workers: false
  shuffle: true # matually exclusive with sampler
  mode: ${model.lit_cfg.train_mode}

train_sampler: null

val_cfg:
  batch_size: 5
  num_workers: 2
  pin_memory: true
  shuffle: true
  mode: ${model.lit_cfg.val_mode}

test_cfg:
  batch_size: 1
  num_workers: 8
  pin_memory: true
  shuffle: false
  more_info: true
  mode: ${model.lit_cfg.test_mode}
