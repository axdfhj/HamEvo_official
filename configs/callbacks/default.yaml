defaults:
  - model_checkpoint
  - model_summary
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "val/mae"
  mode: "min"
  save_top_k: 5
  every_n_train_steps: 10000
  save_last: True
  auto_insert_metric_name: False

model_summary:
  max_depth: -1
